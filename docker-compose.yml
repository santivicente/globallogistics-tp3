# Levanta exactamente 1 balanceador y 3 réplicas: docker-compose up -d
name: tp3

services:
  api:
    build: ./api
    image: globallogistics/api-envios:1.0
    environment:
      PORT: "3000"
      CPU_WORK_ITERATIONS: "${CPU_WORK_ITERATIONS:-3000}"
    expose:
      - "3000"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  balanceador:
    image: nginx:1.28-alpine
    ports:
      - "${LB_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Generador de carga. Por el perfil, "up -d" no lo levanta: se usa con "run".
  # Corre dentro de la red de Compose para no medir también el reenvío de puertos de Windows.
  ab:
    image: httpd:2.4-alpine
    profiles: ["loadtest"]
    entrypoint: ["ab"]
